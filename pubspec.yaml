name: luma_anesthesia
description: "Luma Anesthesia — clinical reference for anesthesia providers."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  # Supabase — real backend. Wire up your project URL + anon key in lib/config.dart
  supabase_flutter: ^2.5.6
  # For tapping source URLs in Drug Detail
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/medications.json
    - assets/branding/luma_icon.png
