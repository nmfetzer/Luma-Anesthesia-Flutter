name: luma_anesthesia
description: "Luma Anesthesia — clinical reference for anesthesia providers."
publish_to: "none"
# Keep the release name aligned with scripts/build_apple_review.sh.
# Supply a new unused --build-number for every App Store upload.
version: 3.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  purchases_flutter: 10.13.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  # Supabase — real backend. Wire up your project URL + anon key in lib/config.dart
  supabase_flutter: ^2.5.6
  # For tapping source URLs in Drug Detail
  url_launcher: ^6.3.0
  web: ^1.1.1
  http: ^1.6.0
  shared_preferences: ^2.5.3
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0
  # Tested PDF viewer version; requires the Dart 3.13 toolchain.
  pdfrx: 2.6.5
  pdf: 3.13.1
  printing: 5.15.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/medications.json
    - assets/data/provider_support.json
    - assets/branding/luma_icon.png
    - assets/branding/luma_symbol_halo.png
    - assets/branding/google_g.png
    - assets/branding/luma_assistant.png
    - assets/branding/ce_halo_symbol.png
    - assets/branding/ce_halo_certificate_logo.png
    - assets/branding/ce_halo_preview_signature.png
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/fonts/offline/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/offline/Inter-Regular.ttf
        - asset: assets/fonts/offline/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/offline/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/offline/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/offline/Inter-Italic.ttf
          style: italic
    - family: Fraunces
      fonts:
        - asset: assets/fonts/offline/Fraunces-Regular.ttf
        - asset: assets/fonts/offline/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/offline/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/offline/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/offline/Fraunces-Italic.ttf
          style: italic
        - asset: assets/fonts/offline/Fraunces-MediumItalic.ttf
          weight: 500
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/offline/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/offline/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/offline/JetBrainsMono-Bold.ttf
          weight: 700
